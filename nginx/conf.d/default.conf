# ─── HTTP → HTTPS redirect ────────────────────────────────────────────────────
server {
  listen 80;
  server_name umu-sports.umu.ac.ug;

  # Let's Encrypt challenge
  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

# ─── HTTPS server ─────────────────────────────────────────────────────────────
server {
  listen 443 ssl http2;
  server_name umu-sports.umu.ac.ug;

  # SSL certificates (Let's Encrypt)
  ssl_certificate     /etc/letsencrypt/live/umu-sports.umu.ac.ug/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/umu-sports.umu.ac.ug/privkey.pem;

  # SSL hardening
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_ciphers HIGH:!aNULL:!MD5;
  ssl_prefer_server_ciphers on;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 10m;

  # Security headers
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-XSS-Protection "1; mode=block" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

  # Uploads — serve uploaded files directly
  location /uploads/ {
    alias /var/www/uploads/;
    expires 30d;
    add_header Cache-Control "public, immutable";
  }

  # API — proxy to Express backend
  location /api/ {
    limit_req zone=api burst=20 nodelay;

    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # File upload size limit (5 MB)
    client_max_body_size 5m;
  }

  # Auth endpoints — stricter rate limit
  location /api/auth/ {
    limit_req zone=auth burst=3 nodelay;

    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Frontend SPA — serve built React app with fallback
  location / {
    root /usr/share/nginx/html;
    index index.html;
    try_files $uri $uri/ /index.html;
  }

  # Cache static assets
  location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
    root /usr/share/nginx/html;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
